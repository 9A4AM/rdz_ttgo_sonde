# nginx site config for serving rdz_ttgo_sonde OTA artifacts.
# The ESP32 downloads over plain HTTP and requires the app image to be sent as
# application/octet-stream (see fetchHTTPheader() in RX_FSK.ino). The web UI's
# version check (upd.html) fetches update-info.html cross-origin, so CORS is needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    autoindex on;                       # browse the folder in a browser (optional)
    add_header Access-Control-Allow-Origin *;

    # Firmware image: force the content type the device's HTTP parser insists on,
    # and disable caching so a rebuilt image is always picked up.
    location ~ \.bin$ {
        default_type application/octet-stream;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-store";
    }
}
