<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <script src="theme.js?v=%VERSION_ID%"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rdzTTGOsonde SD card file browser</title>
    <link rel="stylesheet" type="text/css" href="style.css?v=%VERSION_ID%">
    <style>
        /* style.css is linked only for the theme tokens; neutralise its legacy
           table styling so this page keeps its own flat look. */
        table, th, td { background: transparent; border: 0; }
        body { font-family: Arial, sans-serif; margin: 20px auto; max-width: 1000px;
               height: auto; background: var(--bg); color: var(--text); }
        h1 { color: var(--text); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border-soft); }
        th { background: var(--brand); color: var(--on-brand); }
        tr:hover { background: var(--bg-alt); }
        #viewModal { display: none; position: fixed; z-index: 10; inset: 0; background: var(--overlay); overflow: auto; }
        #viewModal.show { display: flex; align-items: center; justify-content: center; }
        .modalContent { background: var(--surface); color: var(--text); padding: 16px; max-width: 95%;
                        max-height: 90vh; overflow: auto; border-radius: 8px; }
        .modalContent h2 { margin-top: 0; }
        .modalContent table { font-size: 0.9em; }
        .modalContent th, .modalContent td { padding: 4px 8px; border: 1px solid var(--border-soft); }
        .modalContent th { background: var(--brand); color: var(--on-brand); }
    </style>
    <script src="dialog.js"></script>
</head>
<body>
    <div id="viewModal">
        <div class="modalContent">
            <h2 id="viewModalTitle">CSV</h2>
            <div id="viewModalTable"></div>
            <p><button type="button" id="viewModalClose">Close</button></p>
        </div>
    </div>
    <h1>SD Card Directory Listing</h1>
    <table id="fileTable">
        <thead>
            <tr>
                <th>Filename</th>
                <th>Size (bytes)</th>
                <th>Timestamp</th>
                <th colspan="2">Action</th>
            </tr>
        </thead>
        <tbody>
            <!-- File entries will be inserted here -->
        </tbody>
    </table>

    <script>
        const params = new URLSearchParams(window.location.search);
        const dir = params.get('dir') || '';
        const pdir = dir ? dir+"/" : '';

        async function fetchAllEntries() {
            const all = [];
            let start = 0;
            for (;;) {
                const url = '/files.json' + (dir ? '?dir='+encodeURIComponent(dir) : '') + (dir ? '&' : '?') + 'start=' + start;
                const response = await fetch(url);
                const data = await response.json();
                if (!Array.isArray(data) || data.length === 0) break;
                all.push(...data);
                start += data.length;
            }
            return all;
        }

        function renderRow(tableBody, file) {
            const row = document.createElement('tr');
            const nameCell = document.createElement('td');
            const sizeCell = document.createElement('td');
            const tsCell = document.createElement('td');
            const viewCell = document.createElement('td');
            const deleteCell = document.createElement('td');

            const link = document.createElement('a');
            if (file.dir === 1) {
                link.href = `sdfiles.html?dir=${encodeURIComponent(pdir + file.name)}`;
                link.textContent = `📁 ${file.name}`;
            } else {
                link.href = `/sd/${pdir}${file.name}`;
                link.textContent = file.name;
            }
            nameCell.appendChild(link);
            sizeCell.textContent = file.size !== undefined ? file.size : '';
            tsCell.textContent = file.ts;

            if (file.dir !== 1) {
                const viewBtn = document.createElement('button');
                viewBtn.textContent = '🔍';
                viewBtn.title = 'View file';
                viewBtn.style.cursor = 'pointer';
                viewBtn.onclick = () => viewCsv(pdir + file.name, file.name);
                viewCell.appendChild(viewBtn);
            }

            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = '🗑️';
            deleteBtn.title = 'Delete';
            deleteBtn.style.cursor = 'pointer';
            deleteBtn.onclick = () => {
                showConfirm(`Confirm to delete "${file.name}"?`).then(ok => {
                    if (!ok) return;
                    fetch(`sdrm.html?file=${pdir}${encodeURIComponent(file.name)}`)
                        .then(resp => resp.ok ? (showAlert('Deleted.'), row.remove()) : showAlert('Delete failed.'))
                        .catch(() => showAlert('Error sending request.'));
                });
            };
            deleteCell.appendChild(deleteBtn);

            row.append(nameCell, sizeCell, tsCell, viewCell, deleteCell);
            tableBody.appendChild(row);
        }

        function parseCsv(text) {
            const lines = text.split(/\r?\n/).filter(l => l.length > 0);
            return lines.map(line => {
                const row = [];
                let cell = '', inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const c = line[i];
                    if (c === '"') { inQuotes = !inQuotes; continue; }
                    if (!inQuotes && c === ',') { row.push(cell.trim()); cell = ''; continue; }
                    cell += c;
                }
                row.push(cell.trim());
                return row;
            });
        }

        function viewCsv(path, title) {
            const modal = document.getElementById('viewModal');
            const titleEl = document.getElementById('viewModalTitle');
            const tableEl = document.getElementById('viewModalTable');
            titleEl.textContent = title;
            tableEl.innerHTML = 'Loading…';
            modal.classList.add('show');
            fetch('/sd/' + path)
                .then(r => r.text())
                .then(text => {
                    const rows = parseCsv(text);
                    if (rows.length === 0) { tableEl.innerHTML = '<p>Empty file.</p>'; return; }
                    let html = '<table><tbody>';
                    rows.forEach(row => {
                        html += '<tr>';
                        row.forEach(cell => html += '<td>' + escapeHtml(cell) + '</td>');
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    tableEl.innerHTML = html;
                })
                .catch(err => {
                    tableEl.innerHTML = '<p>Error loading file: ' + escapeHtml(err.message) + '</p>';
                });
        }

        function escapeHtml(s) {
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        document.getElementById('viewModalClose').onclick = () => {
            document.getElementById('viewModal').classList.remove('show');
        };
        document.getElementById('viewModal').onclick = (e) => {
            if (e.target.id === 'viewModal') e.target.classList.remove('show');
        };

        function sortEntries(entries) {
            return entries.slice().sort((a, b) => {
                const tA = new Date(a.ts || 0).getTime();
                const tB = new Date(b.ts || 0).getTime();
                return tB - tA;
            });
        }

        fetchAllEntries()
            .then(data => {
                const tableBody = document.getElementById('fileTable').getElementsByTagName('tbody')[0];
                sortEntries(data).forEach(file => renderRow(tableBody, file));
            })
            .catch(error => {
                console.error('Error fetching file list:', error);
            });
    </script>
</body>
</html>
