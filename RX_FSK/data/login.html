<!DOCTYPE html>
<html lang="en">
<head>
    <title>rdzTTGOSonde Login</title>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <script src="theme.js?v=%VERSION_ID%"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Login Form</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" type="text/css" href="style.css?v=%VERSION_ID%">
    <style>
        /* Login button: match the project's green primary buttons. */
        #loginForm button[type="submit"] {
            background-color: var(--brand); color: var(--on-brand); border: none; border-radius: 5px;
            padding: 9px 30px; font-size: 14px; cursor: pointer;
            transition: background-color .3s ease;
        }
        #loginForm button[type="submit"]:hover { background-color: var(--brand-hover); }
        #loginForm button[type="submit"]:active { transform: translateY(1px); }
        /* Align the Username/Password labels so their inputs line up. */
        #loginForm label { display: inline-block; min-width: 6em; }
    </style>
    <script>
        // If loaded inside a tab iframe (e.g. after an auth redirect from a tab's content),
        // take over the full window. Carry the parent page + selected tab (its path + #hash)
        // along as ?next= so a successful login returns there -- this preserves the open tab,
        // which the server never sees (the #hash is never sent in the HTTP request).
        if (window.top !== window.self) {
            var dest = "/login.html";
            try {
                var t = window.top.location;
                dest += "?next=" + encodeURIComponent(t.pathname + t.search + t.hash);
            } catch (e) { /* cross-origin (shouldn't happen on-device); fall back to bare login */ }
            window.top.location.href = dest;
        }
    </script>
    <script src="dialog.js?v=%VERSION_ID%" type="text/javascript"></script>
    <script>
        // Validate a return target: must be a local path on this device. Rejects absolute URLs
        // (open-redirect protection) and the login/logout endpoints (which would loop). An
        // optional #tab hash is allowed. Returns the safe path, or null to fall back to home.
        function safeNext(n) {
            if (!n || n[0] !== '/' || n[1] === '/') return null;   // must be local, not "//host"
            if (n.indexOf('://') !== -1 || n.indexOf('\\') !== -1) return null;
            if (n.indexOf('/login.html') === 0 || n.indexOf('/logout') === 0) return null;
            return n;
        }
        function afterLogin() {
            const next = safeNext(new URLSearchParams(window.location.search).get('next'));
            window.location.href = next || '/index.html';
        }
        function doLogin(event) {
            event.preventDefault(); // Prevent form's default submission behavior
            const username = document.getElementById('user').value;
            const password = document.getElementById('pass').value;
            // The server verifies the password against a salted+peppered hash, so the
            // plaintext is sent here (the device has no TLS; the session cookie and all
            // other traffic already travel in clear over HTTP). On success the server
            // replies with a redirect (+Set-Cookie JWT), which fetch follows.
            const body = new URLSearchParams({ user: username, password: password });
            fetch('/login.html', { method: 'POST', body: body, credentials: 'same-origin' })
                .then(resp => {
                    if (resp.ok) { afterLogin(); return; }
                    return resp.text().then(msg => showAlert(msg || 'Login failed'));
                })
                .catch(() => { showAlert('Login failed (network error)'); });
        }
    </script>
</head>
<body>
<div class="wrapper">
 <div class="header"><div id="myTopnav" class="topnav">
  <a href="/index.html" class="tablinks">Home</a>
  <a id="defaultTab" class="tablinks active">Login</a>
 </div>
 <div id="themeToggle" class="themetoggle-mount"></div>
 </div>
 <div id="Login" class="tabcontent" style="display: flex;">
  <div class="system-info">
  <h1>%VERSION_NAME% version %VERSION_ID%</h1>
  <p>Copyright &copy; 2019-2026 by Hansi Reiser, DL9RDZ and contributors</p>
  <br>
    <form id="loginForm" action="/login.html" method="POST" onsubmit="doLogin(event)">
        <label for="user">Username:</label>
        <input type="text" id="user" name="user" required><br><br>

        <label for="pass">Password:</label>
        <input type="password" id="pass" name="password" required><br><br>

        <button type="submit">Login</button>
    </form>
  </div>
  <div class="footer"><span></span><span class="ttgoinfo">rdzTTGOserver %VERSION_ID%</span></div>
 </div>
</div>
</body>
</html>
